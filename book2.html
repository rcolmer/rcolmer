                        <input type="hidden" name="message" value="I would like to sign up for updates about the new novel.">
                        <button type="submit" class="btn btn-primary">Sign Up</button>
                        <p class="text-base text-center text-gray-400 mt-3" id="result"></p>
                    </form>
                </div>
            </div>
